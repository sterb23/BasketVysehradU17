<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web Clone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1a2a;
            font-family: 'Fredoka One', cursive, sans-serif;
            touch-action: none; /* Prevents zooming on mobile */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 5px 0 #008888;
            transition: opacity 0.3s ease;
        }

        p {
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            animation: pulse 1.5s infinite;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            text-shadow: 0 3px 0 #000;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-display" class="hidden">Score: <span id="score">0</span></div>
        <div id="start-screen">
            <h1 id="title">Geometry<br>Dash</h1>
            <p id="instruction">Click, Tap, or Press SPACE to Jump</p>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiStartScreen = document.getElementById('start-screen');
        const uiScoreDisplay = document.getElementById('score-display');
        const scoreElement = document.getElementById('score');

        let width, height;
        let groundY;
        
        // Game State
        let state = 'start'; // start, playing, dead
        let score = 0;
        let gameSpeed = 8;
        let frame = 0;
        let cameraX = 0;

        // Player (The Cube)
        const player = {
            x: 0,
            y: 0,
            size: 40,
            vy: 0,
            gravity: 0.9,
            jumpPower: -13,
            isGrounded: true,
            rotation: 0,
            targetRotation: 0,
            color1: '#00ffff', // Outer color
            color2: '#ff00ff', // Inner color
            trail: []
        };

        // Entities
        let obstacles = [];
        let particles = [];

        // Resize Canvas
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            groundY = height - 120;
            
            if(state === 'start') {
                player.x = width * 0.2;
                player.y = groundY - player.size;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        function jump() {
            if (state === 'start' || state === 'dead') {
                resetGame();
                state = 'playing';
                uiStartScreen.classList.add('hidden');
                uiScoreDisplay.classList.remove('hidden');
                return;
            }

            if (state === 'playing' && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                // Rotate by 180 degrees every jump
                player.targetRotation += Math.PI; 
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') jump();
        });
        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', jump);

        // Map Generation
        function spawnObstacle() {
            // Ensure gap between obstacles
            let lastObs = obstacles[obstacles.length - 1];
            let spawnX = width;
            if (lastObs) {
                spawnX = Math.max(width, lastObs.x + 300 + Math.random() * 400);
            }

            // 0 = spike on ground, 1 = block, 2 = multiple spikes, 3 = high block
            let type = Math.floor(Math.random() * 4);
            
            if (type === 0) {
                // Spike
                obstacles.push({ type: 'spike', x: spawnX, y: groundY, w: 40, h: 40 });
            } else if (type === 1) {
                // Block
                obstacles.push({ type: 'block', x: spawnX, y: groundY, w: 40, h: 40 });
                // Sometimes put a spike on it or after it
                if (Math.random() > 0.5) {
                    obstacles.push({ type: 'spike', x: spawnX, y: groundY - 40, w: 40, h: 40 });
                }
            } else if (type === 2) {
                // 2 Spikes
                obstacles.push({ type: 'spike', x: spawnX, y: groundY, w: 40, h: 40 });
                obstacles.push({ type: 'spike', x: spawnX + 40, y: groundY, w: 40, h: 40 });
            } else if (type === 3) {
                // Floating block sequence
                obstacles.push({ type: 'block', x: spawnX, y: groundY - 50, w: 40, h: 40 });
                obstacles.push({ type: 'block', x: spawnX + 40, y: groundY - 50, w: 40, h: 40 });
                obstacles.push({ type: 'block', x: spawnX + 80, y: groundY - 50, w: 40, h: 40 });
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 6 + 2,
                    life: 1,
                    color: Math.random() > 0.5 ? player.color1 : player.color2
                });
            }
        }

        function resetGame() {
            player.x = width * 0.2;
            player.y = groundY - player.size;
            player.vy = 0;
            player.rotation = 0;
            player.targetRotation = 0;
            player.isGrounded = true;
            player.trail = [];
            
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 8;
            cameraX = 0;
            
            // Initial obstacles
            for(let i=0; i<3; i++) spawnObstacle();
        }

        function killPlayer() {
            state = 'dead';
            createExplosion(player.x + player.size/2, player.y + player.size/2);
            uiStartScreen.classList.remove('hidden');
            document.getElementById('title').innerText = "CRASHED!";
            document.getElementById('instruction').innerText = "Click to Restart";
        }

        // Main Game Loop
        function update() {
            if (state === 'playing') {
                cameraX += gameSpeed;
                score += 1;
                scoreElement.innerText = Math.floor(score / 10);
                gameSpeed += 0.001; // Slowly increase speed

                // Physics
                player.vy += player.gravity;
                player.y += player.vy;
                player.isGrounded = false;

                // Floor Collision
                if (player.y + player.size >= groundY) {
                    player.y = groundY - player.size;
                    player.vy = 0;
                    player.isGrounded = true;
                    // Snap rotation to nearest 90 degrees (Math.PI/2)
                    let nearest90 = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                    player.rotation = nearest90;
                    player.targetRotation = nearest90;
                }

                // Smooth Rotation in Air
                if (!player.isGrounded) {
                    player.rotation += (player.targetRotation - player.rotation) * 0.15;
                }

                // Trail Update
                if (frame % 3 === 0) {
                    player.trail.push({ x: player.x, y: player.y, rot: player.rotation, alpha: 0.5 });
                    if (player.trail.length > 10) player.trail.shift();
                }

                // Obstacle Logic
                // Maintain spawn rate
                if (obstacles.length > 0 && obstacles[obstacles.length - 1].x < width * 2) {
                    spawnObstacle();
                }

                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;

                    // AABB Collision bounds
                    let pLeft = player.x + 4; // slight hitbox leniency
                    let pRight = player.x + player.size - 4;
                    let pTop = player.y + 4;
                    let pBottom = player.y + player.size - 4;

                    let oLeft = obs.x;
                    let oRight = obs.x + obs.w;
                    let oTop = obs.y - obs.h; // obstacles are anchored at bottom
                    let oBottom = obs.y;

                    // Check overlap
                    if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
                        
                        if (obs.type === 'spike') {
                            killPlayer();
                        } else if (obs.type === 'block') {
                            // Determine if hitting side or top
                            // If previous bottom was above the block's top, we landed on it
                            let prevBottom = (player.y - player.vy) + player.size;
                            
                            if (prevBottom <= oTop + 10 && player.vy > 0) {
                                // Landed on block
                                player.y = oTop - player.size;
                                player.vy = 0;
                                player.isGrounded = true;
                                let nearest90 = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                                player.rotation = nearest90;
                                player.targetRotation = nearest90;
                            } else {
                                // Hit the side
                                killPlayer();
                            }
                        }
                    }
                }

                // Cleanup passed obstacles
                obstacles = obstacles.filter(obs => obs.x + obs.w > -100);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Background gradient
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#0a0a2a');
            bgGradient.addColorStop(1, '#1a3a5a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Draw Background Grid (Parallax)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            let gridSize = 60;
            let offsetX = -(cameraX * 0.2) % gridSize;
            
            ctx.beginPath();
            for (let x = offsetX; x < width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();

            // Draw Ground
            ctx.fillStyle = '#0f2030';
            ctx.fillRect(0, groundY, width, height - groundY);
            
            ctx.strokeStyle = player.color1; // ground line matches player neon
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.color1;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0; // reset

            // Draw Obstacles
            for (let obs of obstacles) {
                ctx.shadowBlur = 15;
                if (obs.type === 'spike') {
                    ctx.shadowColor = '#ff0000';
                    ctx.fillStyle = '#111';
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w / 2, obs.y - obs.h); // Top point
                    ctx.lineTo(obs.x + obs.w, obs.y); // Bottom right
                    ctx.lineTo(obs.x, obs.y); // Bottom left
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 'block') {
                    ctx.shadowColor = '#00ffcc';
                    ctx.fillStyle = '#111';
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 2;
                    ctx.fillRect(obs.x, obs.y - obs.h, obs.w, obs.h);
                    ctx.strokeRect(obs.x, obs.y - obs.h, obs.w, obs.h);
                    
                    // Inner grid for block
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
                    ctx.strokeRect(obs.x + 5, obs.y - obs.h + 5, obs.w - 10, obs.h - 10);
                }
                ctx.shadowBlur = 0;
            }

            // Draw Player & Trail (if playing or dead)
            if (state !== 'start') {
                // Trail
                for (let t of player.trail) {
                    t.alpha -= 0.05;
                    if(t.alpha < 0) t.alpha = 0;
                    ctx.save();
                    ctx.translate(t.x + player.size/2, t.y + player.size/2);
                    ctx.rotate(t.rot);
                    ctx.fillStyle = `rgba(0, 255, 255, ${t.alpha})`;
                    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
                    ctx.restore();
                }

                // Player (Only if alive)
                if (state === 'playing') {
                    ctx.save();
                    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                    ctx.rotate(player.rotation);
                    
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = player.color1;
                    
                    // Outer square
                    ctx.fillStyle = player.color1;
                    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    
                    // Inner square
                    ctx.fillStyle = player.color2;
                    let innerSize = player.size * 0.5;
                    ctx.fillRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);
                    
                    // Cube Face details (eyes/mouth style)
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-8, -8, 4, 4);
                    ctx.fillRect(4, -8, 4, 4);
                    ctx.fillRect(-6, 2, 12, 3);

                    ctx.restore();
                }
            }

            // Draw Particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            frame++;
            requestAnimationFrame(loop);
        }

        // Start Loop
        loop();

    </script>
</body>
</html>
